<aside class="app-sidebar" id="app-sidebar" aria-label="Menú del sistema">
  <div class="sidebar-header">
    <div class="sidebar-header-bar">
      <div class="sidebar-brand-row">
        <div class="sidebar-logo" aria-hidden="true">RB</div>
        <div class="sidebar-brand-copy">
          <strong>ROBIOTEC</strong>
          <span>Security</span>
        </div>
      </div>
      <button
        class="sidebar-toggle"
        id="sidebar-toggle"
        type="button"
        aria-label="Expandir menú"
        aria-controls="app-sidebar"
        aria-expanded="false"
      ></button>
    </div>
    <div class="sidebar-brand-meta">
      <span class="sidebar-brand-kicker">Security Console</span>
      <p class="sidebar-brand-note">Monitoreo visual, telemetría y eventos desde un único punto de control.</p>
    </div>
  </div>
  <nav class="sidebar-nav" aria-label="Navegación principal">
    <div class="sidebar-nav-head">
      <span>Navegación</span>
      <strong>Centro operativo</strong>
    </div>
    __SIDEBAR_NAV_LINKS__
  </nav>

  <div class="sidebar-footer" aria-label="Resumen del menú">
    <div class="sidebar-footer-user" aria-label="Usuario autenticado">
      <span class="sidebar-footer-user-label">Usuario activo</span>
      <strong class="sidebar-footer-user-name">__AUTH_USERNAME__</strong>
    </div>
  </div>
  <button class="sidebar-link sidebar-link-logout" type="button" aria-label="Cerrar sesión">
    <span class="sidebar-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path
          d="M10 7.75V6.5A2.5 2.5 0 0 1 12.5 4h4A2.5 2.5 0 0 1 19 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-4A2.5 2.5 0 0 1 10 17.5v-1.25"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.8"
        />
        <path
          d="M14.5 12H5.75m0 0 2.75-2.75M5.75 12l2.75 2.75"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.8"
        />
      </svg>
    </span>
    <span class="sidebar-link-copy">
      <strong>Cerrar sesión</strong>
      <span>Salir del panel</span>
    </span>
    <span class="sidebar-link-tooltip" aria-hidden="true">Cerrar sesión</span>
  </button>
</aside>
